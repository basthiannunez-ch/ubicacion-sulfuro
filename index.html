  .caja { width: 100%; max-width: 380px; background: var(--panel); border-radius: 14px; padding: 22px 20px 18px; box-shadow: 0 18px 50px rgba(0,0,0,.45); border-top: 6px solid var(--accent); }
  .logos { display: flex; align-items: center; gap: 12px; margin-bottom: 14px; }
  .logos img { height: 30px; width: auto; } .logos span { width: 1px; align-self: stretch; background: #ddd; }
  h1 { font-family: "Barlow Condensed", Arial, sans-serif; font-size: 28px; line-height: 1.05; margin: 0 0 4px; }
  p { margin: 0 0 14px; color: var(--muted); font-size: 15px; }
  label { display: block; font-family: "Barlow Condensed", Arial, sans-serif; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; font-size: 13px; color: var(--muted); margin-bottom: 4px; }
  input[type=password] { width: 100%; font-size: 22px; letter-spacing: .2em; padding: 10px 12px; border: 2px solid #e2d6c4; border-radius: 8px; background: #f3ece1; color: var(--ink); }
  input:focus-visible, button:focus-visible { outline: 3px solid #0f3b66; outline-offset: 2px; }
  .rec { display: flex; align-items: center; gap: 8px; margin: 12px 0 14px; font-size: 15px; color: var(--ink); text-transform: none; letter-spacing: 0; font-family: inherit; font-weight: 400; }
  button { width: 100%; min-height: 48px; border: 0; border-radius: 10px; background: var(--accent); color: #fff; font: 700 18px/1 "Barlow Condensed", Arial, sans-serif; cursor: pointer; }
  button[disabled] { opacity: .6; cursor: wait; }
  #err { color: var(--here); font-weight: 600; min-height: 22px; margin: 10px 0 0; font-size: 15px; }
  small { display: block; margin-top: 12px; color: var(--muted); font-size: 12px; }
</style>

  const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
  const LLAVE = 'ubicacion-sulfuro-llave';
  async function abrir(raw) {
    const k = await crypto.subtle.importKey('raw', raw, 'AES-GCM', false, ['decrypt']);
    const html = new TextDecoder().decode(await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64(D.i) }, k, b64(D.c)));
    document.open(); document.write(html); document.close();
  }
  async function derivar(clave) {
    const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(clave), 'PBKDF2', false, ['deriveBits']);
    return new Uint8Array(await crypto.subtle.deriveBits({ name: 'PBKDF2', hash: 'SHA-256', salt: b64(D.s), iterations: D.n }, base, 256));
  }
  // Si este celular ya entró antes, abre directo
  (async () => {
    let g = null;
    try { g = localStorage.getItem(LLAVE); } catch (e) {}
    if (!g) return;
    try { await abrir(b64(g)); } catch (e) { try { localStorage.removeItem(LLAVE); } catch (_) {} }

  document.getElementById('f').onsubmit = async ev => {
    ev.preventDefault();
    const btn = document.getElementById('btn'), err = document.getElementById('err');
    btn.disabled = true; btn.textContent = 'Revisando…'; err.textContent = '';
    try {
      const raw = await derivar(document.getElementById('clave').value);
      if (document.getElementById('recordar').checked) {
        try { localStorage.setItem(LLAVE, btoa(String.fromCharCode(...raw))); } catch (e) {}

      await abrir(raw);

      btn.disabled = false; btn.textContent = 'Entrar';
